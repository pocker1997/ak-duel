<script type="module">
import * as THREE from 'three';
const V3 = THREE.Vector3, DEG = Math.PI / 180;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
const wrapAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

// ================= CONFIG =================
const WEAPONS = {
  // АК-47, 7.62×39: ~600 в/хв, 715 м/с, магазин 30 (+1 у патроннику при тактичній перезарядці)
  ak: {
    id: 'ak', name: 'АК-47', auto: true, rpm: 600, magSize: 30, reserve: 120, velocity: 715, reload: 2.6, reloadEmpty: 3.3,
    dmg: { head: 120, torso: 40, arm: 24, legs: 26 },
    spreadHip: 1.6 * DEG, spreadAds: 0.12 * DEG, spreadMove: 0.35 * DEG, spreadAir: 4 * DEG,
    bloomPerShot: 0.18 * DEG, bloomMax: 2 * DEG, bloomDecay: 3 * DEG,
    recoilV: 1.1 * DEG, recoilVRand: 0.25 * DEG, recoilH: 0.45 * DEG, recoverFiring: 2.0, recoverIdle: 7,
    adsFov: 52, adsTime: 0.2, scope: false, pen: 0.3, crateDmg: 20, hearing: 60, gore: 1,
  },
  // снайперська гвинтівка під .338 Lapua Magnum: ковзний затвор, 5 набоїв, ~900 м/с, приціл ×6.
  // Вбиває з одного влучання; з руки майже не влучає; у прицілі дихання хитає сітку (Shift — затримати)
  sniper: {
    id: 'sniper', name: 'СНАЙПЕРКА .338', auto: false, bolt: 1.25, magSize: 5, reserve: 20, velocity: 900, reload: 3.4, reloadEmpty: 4.0,
    dmg: { head: 300, torso: 180, arm: 110, legs: 110 },
    spreadHip: 4 * DEG, spreadAds: 0.02 * DEG, spreadMove: 1.2 * DEG, spreadAir: 8 * DEG,
    bloomPerShot: 0, bloomMax: 0, bloomDecay: 1,
    recoilV: 5 * DEG, recoilVRand: 0.8 * DEG, recoilH: 1.2 * DEG, recoverFiring: 4, recoverIdle: 4,
    adsFov: 11, adsTime: 0.35, scope: true, pen: 0.1, crateDmg: 70, hearing: 120, gore: 2.2,
    swayScoped: 0.35 * DEG, holdBreath: 5, breathRecover: 3,
  },
};
const BOT = {
  reactionMin: 0.22, reactionRand: 0.28, aimErrStart: 5 * DEG, aimErrMin: 0.5 * DEG, aimSettle: 1.3,
  turnSpeed: 5, fov: 65 * DEG, hearing: 60, headChance: 0.25, recoilComp: 3.5,
  runSpeed: 4.8, sneakSpeed: 1.9, sneakDist: 12, patrolSpeed: 2.8, calloutRange: 30,
};
// поранення: кровотеча (HP/с), наслідки для кінцівок, бинти
const WOUND = {
  bleed: { torso: 1.6, arm: 0.9, legs: 1.1 }, bleedMax: 5, bandageTime: 3, bandages: 2,
  legSpeed: 0.62, armSway: 0.55 * DEG, armReload: 1.3, armRecoil: 1.15, armBotAim: 2.2,
};
// звук: радіус, на якому боти чують (м); за стіною ×wallMul
const NOISE = { step: 28, land: 20, reload: 10, gunshot: 60, wallMul: 0.6 };
// дерев'яні ящики: пробиваються і руйнуються
const CRATE = { hp: 260, bulletDmg: 20, penLossPerM: 0.3, minPen: 0.2, deflect: 1.5 * DEG };
// нахил Q/E: зсув голови вбік (м) і крен камери
const LEAN = { dist: 0.38, roll: 12 * DEG, speed: 7 };
const MOVE = { walk: 4.2, sprint: 6.0, crouch: 1.8, adsMul: 0.6, jump: 3.8, gravity: 9.81 };
// забирання на перешкоду (Space біля ящика/блока): висота, яку можна подолати
const MANTLE = { minRise: 0.25, maxRise: 1.5 };
const BLOOD = { max: 1500, poolSize: 1.5, poolGrow: 5 };
const loudness = sp => sp < 0.5 ? 0 : sp < 2.3 ? 0.15 : sp < 4.7 ? 0.55 : 1;

// ================= MAPS =================
// A map is a set of axis-aligned boxes (colliders + visuals) on a cell grid. Cells free at floor level form the
// bots' navigation grid. The map is picked at load: #map=… in the link (so a PvP room shares it), else the saved setting.
const settings = { bots: 1, kills: 5, botSnipers: 'none', map: 'trenches' };
try { Object.assign(settings, JSON.parse(localStorage.getItem('akd_settings') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('akd_settings', JSON.stringify(settings)); } catch (e) {} };
const MAP_IDS = ['blocks', 'trenches'];
const mapFromUrl = () => (location.hash.match(/map=([a-z]+)/) || [])[1] || null;
const MAP_ID = [mapFromUrl(), settings.map].find(m => MAP_IDS.includes(m)) || 'trenches';

// c: instance colour; top/side: vertex-colour gradient (grass on top, clay on the walls); hidden: collider only
const BLOCK = {
  '#': { c: 0xb9b3a7 }, 'B': { c: 0x8b96a1 }, 'b': { c: 0xa3824f },
  'e': { c: 0xffffff, top: 0x707246, side: 0x5b4633 },  // earth
  'c': { c: 0xffffff, top: 0x4b4232, side: 0x47392a },  // shell crater, scorched
  'm': { c: 0xffffff, top: 0x3c4a2b, side: 0x3a3226 },  // boundary berm / tree line
  's': { c: 0x8a7e5b },  // sandbags
  'w': { c: 0x6a4a2c },  // logs, planks
  'r': { c: 0x9a8b79 },  // ruined brick house
  't': { c: 0x3a3029 },  // burnt trees
  'v': { c: 0x4b5339 },  // wrecked armoured vehicle
  'x': { hidden: true },
};
const mkBox = (minx, miny, minz, maxx, maxy, maxz, ch, cx = -1, cz = -1) => ({ minx, miny, minz, maxx, maxy, maxz, ch, cx, cz, hp: CRATE.hp, idx: 0, gi: 0 });
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function buildBlocksMap() {
  const MAP = [
    '########################',
    '#P.....#...S....#.....E#',
    '#......#..b.....#......#',
    '#..bb..#........#..bb..#',
    '#...............B......#',
    '#......####..####......#',
    '#..b...................#',
    '#S....................S#',
    '####..b....BB....b..####',
    '#.........#..#.........#',
    '#..B......#..#......B..#',
    '#......bb........bb....#',
    '#......bb........bb....#',
    '#..B......#..#......B..#',
    '#.........#..#.........#',
    '####..b....BB....b..####',
    '#S....................S#',
    '#...................b..#',
    '#......####..####......#',
    '#......B...............#',
    '#..bb..#........#..bb..#',
    '#......#.....b..#......#',
    '#E.....#...S....#.....P#',
    '########################',
  ];
  const H = { '#': 3.5, 'B': 2.2, 'b': 1.2 }, cell = 2, boxes = [], spawns = [];
  MAP.forEach((row, z) => [...row].forEach((ch, x) => {
    if (H[ch]) boxes.push(mkBox(x * cell, 0, z * cell, (x + 1) * cell, H[ch], (z + 1) * cell, ch, x, z));
    if ('PES'.includes(ch)) spawns.push(new V3(x * cell + cell / 2, 0, z * cell + cell / 2));
  }));
  return { cell, cols: MAP[0].length, rows: MAP.length, boxes, spawns, decor: [], wires: [],
    env: { sky: 0xa9bccd, fog: [35, 110], hemi: [0xe4ecff, 0x524636, 1.5], sun: [0xfff1dd, 2.2], floor: 'checker' } };
}

// Two trench systems facing each other across a shelled no-man's land: crenellated fire trenches with firing bays and
// sandbagged parapets, a support trench behind each, zigzag communication trenches, roofed dugouts, craters,
// a burnt shelterbelt, a ruined house, a wrecked APC, anti-tank hedgehogs and barbed wire.
// Seeded, so every player in a PvP room generates the exact same map.
function buildTrenchMap() {
  const cell = 1, W = 56, D = 76, G = 1.35, rnd = mulberry32(1991);
  const R = (a, b) => a + rnd() * (b - a);
  const hgt = Array.from({ length: D }, () => new Array(W).fill(G));
  const inside = (x, z) => x > 0 && z > 0 && x < W - 1 && z < D - 1;
  const dig = (x, z) => { if (inside(x, z)) hgt[z][x] = 0; };
  const digRect = (x0, z0, x1, z1) => { for (let z = Math.min(z0, z1); z <= Math.max(z0, z1); z++) for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) dig(x, z); };
  const boxes = [], decor = [], wires = [], spawns = [], bays = [];

  // fire trench: bays and traverses, so a burst along the trench can't sweep all of it
  function fireTrench(z0, enemy) {
    let x = 2, off = 0;
    while (x < W - 4) {
      const len = Math.min(W - 3 - x, 5 + Math.floor(rnd() * 3)), z = z0 + off;
      digRect(x, z, x + len, z);
      digRect(x + 1, z + enemy, x + len - 1, z + enemy); // firing bay toward the enemy
      bays.push({ x0: x + 1, x1: x + len - 1, z: z + enemy, enemy });
      const nOff = off === 0 ? -2 * enemy : 0;
      digRect(x + len, z, x + len, z0 + nOff);          // traverse
      off = nOff; x += len;
    }
  }
  function commTrench(x, zA, zB) {
    const s = Math.sign(zB - zA); let cx = x;
    for (let z = zA; z !== zB + s; z += s) {
      dig(cx, z);
      if (Math.abs(z - zA) % 5 === 4) { const nx = cx === x ? x + 2 : x; digRect(cx, z, nx, z); cx = nx; }
    }
  }
  // south (z grows toward the south): enemy is north (-1)
  fireTrench(60, -1); digRect(3, 69, W - 4, 69);
  for (const x of [8, 27, 46]) commTrench(x, 61, 69);
  fireTrench(15, 1); digRect(3, 6, W - 4, 6);
  for (const x of [9, 28, 45]) commTrench(x, 14, 6);
  // dugouts: dug-out rooms behind the support trench, roofed with logs under an earth mound
  const dugouts = [[14, 71, 18, 73, 16, 70], [35, 2, 39, 4, 37, 5]];
  for (const [x0, z0, x1, z1, ex, ez] of dugouts) { digRect(x0, z0, x1, z1); dig(ex, ez); }
  // shell craters: two depths, mostly in no-man's land
  for (let i = 0; i < 36; i++) {
    const cx = R(3, W - 3), cz = i < 28 ? R(19, 57) : R(3, D - 3), r = R(1.3, 3.0);
    for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
      if (!inside(x, z) || hgt[z][x] !== G) continue;
      const d = Math.hypot(x + 0.5 - cx, z + 0.5 - cz);
      if (d < r) hgt[z][x] = d < r * 0.55 ? 0.45 : 0.9;
    }
  }
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) if (!inside(x, z)) hgt[z][x] = 4.2;
  // merge equal-height cells into rectangles: a few hundred colliders instead of thousands
  const used = Array.from({ length: D }, () => new Uint8Array(W));
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const h = hgt[z][x]; if (used[z][x] || h === 0) continue;
    let w = 1; while (x + w < W && !used[z][x + w] && hgt[z][x + w] === h) w++;
    let d = 1;
    grow: while (z + d < D) { for (let k = 0; k < w; k++) if (used[z + d][x + k] || hgt[z + d][x + k] !== h) break grow; d++; }
    for (let zz = z; zz < z + d; zz++) for (let xx = x; xx < x + w; xx++) used[zz][xx] = 1;
    boxes.push(mkBox(x, 0, z, x + w, h, z + d, h === G ? 'e' : h > G ? 'm' : 'c'));
  }
  // dugout roofs + mounds
  for (const [x0, z0, x1, z1, , ez] of dugouts) {
    boxes.push(mkBox(x0, 1.95, z0, x1 + 1, 2.3, z1 + 1, 'w'));
    // mound around the roof; over the entrance it starts at roof height so you can walk in under it
    boxes.push(mkBox(x0 - 1, ez === z0 - 1 ? 1.95 : G, z0 - 1, x1 + 2, 2.3, z0, 'e'), mkBox(x0 - 1, ez === z1 + 1 ? 1.95 : G, z1 + 1, x1 + 2, 2.3, z1 + 2, 'e'));
    boxes.push(mkBox(x0 - 1, G, z0, x0, 2.3, z1 + 1, 'e'), mkBox(x1 + 1, G, z0, x1 + 2, 2.3, z1 + 1, 'e'));
    for (let i = 0; i < 5; i++) decor.push({ ch: 'log', x: R(x0, x1 + 1), y: 2.34, z: R(z0, z1 + 1), sx: 0.22, sy: 0.22, sz: R(2, 3.5), rx: 0, ry: R(0, 3.14), rz: 0 });
  }
  // sandbagged parapets on the firing bays (low enough to shoot over standing, high enough to hide crouched)
  for (const b of bays) {
    const ze = b.z + b.enemy, z0 = b.enemy < 0 ? ze + 0.45 : ze, z1 = b.enemy < 0 ? ze + 1 : ze + 0.55;
    const gap = b.x0 + 1 + Math.floor(rnd() * Math.max(1, b.x1 - b.x0 - 1));
    if (gap > b.x0) boxes.push(mkBox(b.x0, G, z0, gap, G + 0.22, z1, 's'));
    if (gap + 1 <= b.x1 + 1) boxes.push(mkBox(gap + 1, G, z0, b.x1 + 1, G + 0.22, z1, 's'));
    // ammo crates at the end of some bays (destructible cover)
    if (rnd() < 0.4) boxes.push(mkBox(b.x1, 0, b.z, b.x1 + 1, 0.8, b.z + 1, 'b', b.x1, b.z));
  }
  for (const [x0, z0] of dugouts) boxes.push(mkBox(x0, 0, z0, x0 + 1, 0.8, z0 + 1, 'b', x0, z0));
  // burnt shelterbelt (лісосмуга) across the middle: broken trunks and fallen logs
  for (let x = 3; x < W - 3; x += R(1.6, 2.8)) {
    if (rnd() < 0.2) continue;
    const z = 37.5 + R(-0.7, 0.7), s = R(0.25, 0.45), h = rnd() < 0.3 ? R(0.5, 1.4) : R(2, 6.5);
    boxes.push(mkBox(x - s / 2, G, z - s / 2, x + s / 2, G + h, z + s / 2, 't'));
    if (h > 3) for (let k = 0; k < 2; k++) decor.push({ ch: 'log', x: x + R(-0.6, 0.6), y: G + h * R(0.6, 0.9), z: z + R(-0.6, 0.6), sx: 0.1, sy: R(1, 2), sz: 0.1, rx: R(-0.9, 0.9), ry: 0, rz: R(-0.9, 0.9) });
    if (rnd() < 0.15) { const len = R(2.5, 4); boxes.push(mkBox(x, G, z + 1, x + len, G + 0.45, z + 1.45, 't')); }
  }
  // ruined house on the east flank
  const hx0 = 44, hz0 = 40, hx1 = 51, hz1 = 46;
  const wall = (x0, z0, x1, z1) => {
    const alongX = z0 === z1, n = Math.round(alongX ? x1 - x0 : z1 - z0);
    for (let i = 0; i < n; i++) {

   </table>
   <p style="font-size:13px;opacity:.7">Снайперка вбиває з одного влучання, але з руки майже не влучає, а після пострілу треба пересмикнути затвор.
   Снайпер, що цілиться в тебе, дає відблиск оптики. Чути кроки й постріли; дерев'яні ящики простріляються й ламаються.</p>`;
function showPanel() {

// ================= MULTIPLAYER (PvP over WebRTC, PeerJS only for matchmaking) =================
// Star topology: the room creator is the host, everyone else connects to the host and the host relays.
// Each player simulates their own movement and shots; the shooter reports hits, the victim applies the
// damage and reports its own death; the host keeps the score and decides the winner.
const net = { peer: null, host: false, conns: new Map(), hostConn: null, room: null, myId: null, status: '', kills: 5, scores: {}, names: {}, winner: null, sendT: 0 };
const avatars = new Map();
const PEER_PREFIX = 'akduel-v1-';
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cleanName = n => String(n || '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 16) || 'Гравець';
let myName = 'Гравець';
try { myName = cleanName(localStorage.getItem('akd_name')); } catch (e) {}
const roomFromUrl = () => (location.hash.match(/room=([a-z0-9]{3,12})/) || [])[1] || null;
const shareLink = () => `${location.origin}${location.pathname}#room=${net.room}&map=${MAP_ID}`;

function mpScoreHtml() {
  const mine = net.scores[net.myId] || 0;
  const lead = Object.entries(net.scores).filter(([id]) => id !== net.myId).sort((a, b) => b[1] - a[1])[0];
  return `ТИ ${mine}${lead ? ` · ${esc(net.names[lead[0]] || '?')} ${lead[1]}` : ''}<small>PvP · ДО ${net.kills} · ГРАВЦІВ ${avatars.size + 1} · ${esc(net.status)} · TAB</small>`;
}
function boardHtml(inPanel) {
  const rows = Object.entries(net.scores).sort((a, b) => b[1] - a[1])
    .map(([id, k]) => `<tr${id === net.myId ? ' class="me"' : ''}><td>${esc(net.names[id] || '?')}${id === net.myId ? ' (ти)' : ''}</td><td>${k}</td></tr>`).join('');
  return rows ? `<table${inPanel ? ' class="board"' : ''}>${rows}</table>` : '';
}

function netSendRaw(msg, except) {
  if (net.host) { for (const c of net.conns.values()) if (c.open && c !== except) c.send(msg); }
  else if (net.hostConn?.open) net.hostConn.send(msg);
}
// send my own message to the room (the host also processes it itself)
function netEmit(msg) {
  if (!net.myId) return;
  msg.id = net.myId; netSendRaw(msg);
  if (net.host) hostHandle(msg);
}
function onNetData(conn, msg) {
  if (!msg || typeof msg !== 'object' || typeof msg.t !== 'string') return;
  if (net.host) {
    msg.id = conn.peer; // never trust a sender id claimed inside the data
    if (msg.t === 'scores' || msg.t === 'over' || msg.t === 'reset' || msg.t === 'welcome' || msg.t === 'left') return; // host-only messages
    if (msg.t !== 'hello') netSendRaw(msg, conn);
    hostHandle(msg, conn);
  }
  handle(msg);
}
function broadcastScores() { const m = { t: 'scores', id: net.myId, scores: net.scores, names: net.names }; netSendRaw(m); handle(m); }
function hostHandle(msg, conn) {
  if (msg.t === 'hello') {
    net.names[msg.id] = cleanName(msg.name);
    if (!(msg.id in net.scores)) net.scores[msg.id] = 0;
    (conn || net.conns.get(msg.id))?.send({
      t: 'welcome', id: net.myId, map: MAP_ID, kills: net.kills, scores: net.scores, names: net.names,
      over: game.state === 'over' ? net.winner : null,
      crates: allBoxes.filter(b => b.ch === 'b').map(b => [b.gi, Math.round(b.hp)]),
    });
    broadcastScores();
    showMsg(`${net.names[msg.id]} приєднався`, 2);
  } else if (msg.t === 'kill' && game.state === 'playing') {
    if (msg.killer && msg.killer !== msg.victim && msg.killer in net.names) net.scores[msg.killer] = (net.scores[msg.killer] || 0) + 1;
    broadcastScores();
    const win = Object.entries(net.scores).find(([, k]) => k >= net.kills);
    if (win) { const m = { t: 'over', id: net.myId, winner: win[0] }; netSendRaw(m); handle(m); }
  }
}
function handle(msg) {
  const from = msg.id;
  switch (msg.t) {
    case 'welcome':
      // the room plays another map: reload into it (the link then carries the right one)
      if (msg.map && msg.map !== MAP_ID && MAP_IDS.includes(msg.map)) { settings.map = msg.map; saveSettings(); location.hash = `room=${net.room}&map=${msg.map}`; location.reload(); return; }
      net.kills = +msg.kills || 5; net.scores = msg.scores || {}; net.names = msg.names || {};
      for (const [gi, hp] of Array.isArray(msg.crates) ? msg.crates : []) {
        const b = allBoxes[gi | 0];
        if (b && b.ch === 'b' && boxes.includes(b) && +hp < b.hp) damageCrate(b, b.hp - Math.max(0, +hp));
      }
      net.status = `кімната ${net.room}`;
      showMsg(`PvP · перший до ${net.kills} вбивств`, 2.2);
      if (msg.over) { net.winner = msg.over; game.state = 'over'; }
      break;
    case 'scores':
      net.scores = msg.scores || {}; net.names = msg.names || {};
      for (const [id, a] of avatars) a.name = net.names[id] || a.name;
      break;
    case 'st': if (from !== net.myId) applyState(from, msg); break;
    case 'shot': {
      const a = avatars.get(from), w = WEAPONS[msg.w];
      if (!a || !w || !Array.isArray(msg.o) || !Array.isArray(msg.d)) break;
      const [ox, oy, oz] = msg.o.map(Number), [dx, dy, dz] = msg.d.map(Number);
      if (![ox, oy, oz, dx, dy, dz].every(isFinite)) break;
      bullets.push({ x: ox, y: oy, z: oz, vx: dx * w.velocity, vy: dy * w.velocity, vz: dz * w.velocity, owner: a, w, dist: 0, cracked: false, dmgMul: 1, remote: true });
      a.flash.visible = true; a.flash.material.rotation = Math.random() * 6; a.flashT = 0.05;
      a.flash.getWorldPosition(botLight.position); botLightT = 0.05;
      play3d(w.scope ? buf.sniper : buf.shot, new V3(ox, oy, oz), { gain: w.scope ? 1.5 : 1.3, lp: clamp(14000 - camera.position.distanceTo(a.pos) * 180, 2500, 14000) });
      break;
    }
    case 'crate': {
      const b = allBoxes[msg.i | 0];
      if (b && b.ch === 'b' && boxes.includes(b)) damageCrate(b, clamp(+msg.dmg || 0, 0, 200));
      break;
    }
    case 'hit':
      if (msg.to === net.myId && player.alive && game.state === 'playing') {
        const w = WEAPONS[msg.w], part = ['head', 'torso', 'arm', 'legs'].includes(msg.part) ? msg.part : null;
        if (!w || !part) break;
        const att = avatars.get(from) || { id: from, name: net.names[from] || 'гравець', pos: player.pos.clone() };
        camKick(w.scope ? 1.8 : 1, +msg.dx || 0, +msg.dz || 0);
        damage(player, part, att, clamp(+msg.mul || 1, 0, 1), w);
      }
      break;
    case 'kill': {
      const v = avatars.get(msg.victim);
      if (v && v.alive) { v.alive = false; v.fallT = 0; addPool(v.pos.x + Math.sin(v.yaw) * 0.8, v.pos.y + 0.2, v.pos.z + Math.cos(v.yaw) * 0.8); }
      const vn = net.names[msg.victim] || 'гравця';
      if (msg.killer === net.myId) { showMsg(msg.part === 'head' ? `ХЕДШОТ — ти вбив ${vn}` : `Ти вбив ${vn}`, 2); play(buf.tick, { gain: 0.6, rate: 0.8 }); }
      else if (msg.victim !== net.myId) showMsg(msg.killer ? `${net.names[msg.killer] || '?'} вбив ${vn}` : `${vn} стік кров'ю`, 2);
      break;
    }
    case 'over':
      net.winner = msg.winner; game.state = 'over';
      showMsg(`Переміг ${net.names[msg.winner] || '?'}`, 3);
      setTimeout(() => { document.exitPointerLock(); showPanel(); }, 1500);
      break;
    case 'reset': startMpRound(+msg.kills || 5); if (!locked) showPanel(); break;
    case 'left': removeAvatar(msg.who); break;
  }
}

// ---- remote players ----
function createAvatar(id) {
  const s = buildSoldier(avatars.size + 1);
  setSoldierWeapon(s, 'ak');
  const a = {
    isAvatar: true, id, name: net.names[id] || 'Гравець', pos: new V3(-100, 0, -100), tpos: new V3(-100, 0, -100), vel: new V3(),
    r: 0.3, yaw: 0, tyaw: 0, pitch: 0, tpitch: 0, crouch: 0, lean: 0, alive: false, weaponId: 'ak', onGround: true, stepAcc: 0,
    fallT: 1, flashT: 0, hurtFlash: 0, recoilP: 0, recoilY: 0, burstPause: 0, legWound: false, bleedVis: false, dripT: 0, scoped: false,
    fl: { x: 0, vx: 0, z: 0, vz: 0, y: 0, vy: 0, d: 0, vd: 0, h: 0, vh: 0 },
    headY() { return this.pos.y + lerp(1.63, 1.08, this.crouch); },
    ...s,
  };
  avatars.set(id, a);
  return a;
}
function removeAvatar(id) { const a = avatars.get(id); if (a) { scene.remove(a.root); avatars.delete(id); } }
function applyState(id, m) {
  const p = Array.isArray(m.p) ? m.p.map(Number) : null;
  if (!p || p.length !== 3 || !p.every(isFinite)) return;
  const a = avatars.get(id) || createAvatar(id);
  const wasAlive = a.alive; a.alive = !!m.a;
  if (a.alive && !wasAlive) { a.pos.set(p[0], p[1], p[2]); a.body.rotation.set(0, 0, 0); a.fallT = 0; for (const k in a.fl) a.fl[k] = 0; }
  if (!a.alive && wasAlive) a.fallT = 0;
  a.tpos.set(p[0], p[1], p[2]);
  a.vel.set(+m.v?.[0] || 0, 0, +m.v?.[1] || 0);
  a.tyaw = +m.y || 0; a.tpitch = +m.pi || 0; a.crouch = clamp(+m.c || 0, 0, 1); a.lean = clamp(+m.l || 0, -1, 1);
  if (m.w !== a.weaponId && WEAPONS[m.w]) { a.weaponId = m.w; setSoldierWeapon(a, m.w); }
  a.scoped = !!m.sc; a.bleedVis = !!m.bl;
}
function updateAvatars(dt) {
  for (const a of avatars.values()) {
    // states arrive ~20×/s: smooth toward the latest one
    if (a.pos.distanceTo(a.tpos) > 3) a.pos.copy(a.tpos); else a.pos.lerp(a.tpos, Math.min(1, dt * 14));
    a.yaw += wrapAngle(a.tyaw - a.yaw) * Math.min(1, dt * 16);
    a.pitch += (a.tpitch - a.pitch) * Math.min(1, dt * 16);
    a.root.position.copy(a.pos); a.root.rotation.y = a.yaw; a.root.scale.y = lerp(1, 0.68, a.crouch);
    if (a.alive) {
      a.arms.rotation.x = a.pitch;
      updateFlinch(a, dt);
      stepTick(a, dt);
      if (a.bleedVis) { a.dripT -= dt; if (a.dripT <= 0) { a.dripT = 0.35; spurt(a.pos.x + gauss() * 0.12, a.pos.y + 0.95, a.pos.z + gauss() * 0.12, 0, -1, 0, 1, 0.4, 0.3, 0.9); } }
    } else {
      a.fallT = Math.min(1, a.fallT + dt * 2.5);
      a.body.rotation.set((Math.PI / 2) * (1 - Math.pow(1 - a.fallT, 3)), 0, 0);
    }
    if (a.flashT > 0) { a.flashT -= dt; if (a.flashT <= 0) a.flash.visible = false; }
    a.hurtFlash = Math.max(0, a.hurtFlash - dt * 6);
    a.mats.shirt.emissive.setRGB(a.hurtFlash * 0.8, 0, 0); a.mats.skin.emissive.setRGB(a.hurtFlash * 0.8, 0, 0);
    let glint = false;
    if (a.alive && a.scoped && a.weaponId === 'sniper') glint = dirFrom(a.yaw, a.pitch).dot(camera.position.clone().sub(eyeOf(a)).normalize()) > Math.cos(10 * DEG);
    a.glint.visible = glint;
    if (glint) a.glint.scale.setScalar(0.3 + 0.15 * Math.sin(game.time * 9));
  }
}
function netTick(dt) {
  if (!net.myId) return;
  net.sendT -= dt;
  if (net.sendT > 0) return;
  net.sendT = 0.05;
  if (net.host ? net.conns.size === 0 : !net.hostConn?.open) return;
  const r = v => Math.round(v * 100) / 100;
  netEmit({
    t: 'st', p: [r(player.pos.x), r(player.pos.y), r(player.pos.z)], v: [r(player.vel.x), r(player.vel.z)],
    y: r(player.yaw + player.recoilY), pi: r(player.pitch + player.recoilP), c: r(player.crouch), l: r(player.lean),
    w: player.weapon, a: player.alive ? 1 : 0, sc: isScoped() ? 1 : 0, bl: player.bleed > 0 ? 1 : 0,
  });
}

// ---- rooms ----
function hostRoom() {
  leaveRoom(false);
  const code = Math.random().toString(36).slice(2, 7);
  Object.assign(net, { host: true, room: code, kills: settings.kills, status: 'створюю кімнату…' });
  const peer = net.peer = new Peer(PEER_PREFIX + code);
  peer.on('open', id => {
    net.myId = id; net.names = { [id]: myName }; net.scores = { [id]: 0 }; net.status = `кімната ${code}`;
    history.replaceState(null, '', `#room=${code}&map=${MAP_ID}`);
    showMsg('Кімнату створено — Esc, щоб скопіювати лінк для друзів', 3.5);
  });
  peer.on('connection', conn => {
    conn.on('open', () => net.conns.set(conn.peer, conn));
    conn.on('data', msg => onNetData(conn, msg));
    conn.on('close', () => {
      net.conns.delete(conn.peer); removeAvatar(conn.peer);
      const n = net.names[conn.peer];
      delete net.scores[conn.peer]; delete net.names[conn.peer];
      netSendRaw({ t: 'left', id: net.myId, who: conn.peer });
      broadcastScores();
      if (n) showMsg(`${n} вийшов`, 2);
    });
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { hostRoom(); return; }
    net.status = `помилка мережі (${e.type})`; showMsg(net.status, 4);
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (err) {} });
}
function joinRoom(code) {
  leaveRoom(false);
  Object.assign(net, { host: false, room: code, status: 'підключення…' });
  const peer = net.peer = new Peer();
  peer.on('open', id => {
    net.myId = id;
    const conn = net.hostConn = peer.connect(PEER_PREFIX + code, { reliable: true });
    conn.on('open', () => conn.send({ t: 'hello', name: myName }));
    conn.on('data', msg => onNetData(conn, msg));
    conn.on('close', () => {
      net.status = "зв'язок з хостом втрачено";
      for (const id of [...avatars.keys()]) removeAvatar(id);
      showMsg("Хост вийшов або зв'язок обірвався", 4);
    });
  });
  peer.on('error', e => {
    net.status = e.type === 'peer-unavailable' ? 'кімнату не знайдено (хост вийшов?)' : `помилка мережі (${e.type})`;
    showMsg(net.status, 4);
  });
}
function leaveRoom(clearUrl = true) {
  try { net.peer?.destroy(); } catch (e) {}
  for (const id of [...avatars.keys()]) removeAvatar(id);
  Object.assign(net, { peer: null, host: false, conns: new Map(), hostConn: null, myId: null, room: null, status: '', scores: {}, names: {}, winner: null });
  if (clearUrl) history.replaceState(null, '', location.pathname);
}
function startMpRound(kills) {
  game.mode = 'mp'; game.state = 'playing'; net.kills = kills; net.winner = null;
  for (const k in net.scores) net.scores[k] = 0;
  bullets.length = 0;
  resetLevel(); setupBots(0); respawnPlayer();
  for (const a of avatars.values()) a.alive = false; // everyone respawns and re-announces
  showMsg(`PvP · перший до ${kills} вбивств`, 2.2);
}
function hostNewRound() {
  const m = { t: 'reset', id: net.myId, kills: settings.kills };
  netSendRaw(m); startMpRound(settings.kills); broadcastScores();
}

// ================= INPUT =================
$('panel').addEventListener('input', e => {
  if (e.target.id !== 'nick') return;
  myName = cleanName(e.target.value);
  try { localStorage.setItem('akd_name', myName); } catch (err) {}
});
$('panel').addEventListener('click', e => {
  const el = e.target.closest('[data-k],[data-act]');
  if (!el) return;
  e.stopPropagation();
  if (el.dataset.k) {
    const raw = el.dataset.v;
    settings[el.dataset.k] = isNaN(+raw) ? raw : +raw;
    saveSettings();
    // the level is built at load, so a different map means a reload
    if (el.dataset.k === 'map' && raw !== MAP_ID) { history.replaceState(null, '', location.pathname); location.reload(); return; }
    if (game.state === 'playing' && game.mode === 'bots') game.state = 'menu';
    showPanel(); return;
  }
  const act = el.dataset.act;
  if (act === 'copy') {
    const l = $('link'); l.select();
    navigator.clipboard?.writeText(l.value).then(() => { el.textContent = 'Скопійовано ✓'; }, () => { el.textContent = 'Виділено — Cmd+C'; });
    return;
  }
  if (act === 'leave') { leaveRoom(); game.state = 'menu'; game.mode = 'bots'; bullets.length = 0; showPanel(); return; }
  if ((act === 'host' || act === 'join') && typeof Peer === 'undefined') { showMsg('Мережева бібліотека не завантажилась — перевір інтернет', 4); return; }
  initAudio();
  if (act === 'bots') { if (net.peer) leaveRoom(); startMatch(); }
  else if (act === 'host') { hostRoom(); startMpRound(settings.kills); }
  else if (act === 'join') { joinRoom(roomFromUrl()); startMpRound(net.kills); }
  else if (act === 'newround') hostNewRound();
  renderer.domElement.requestPointerLock();
});
$('overlay').addEventListener('click', e => {
  if (e.target.closest('button,input')) return;
  if (game.state !== 'playing') return;
  initAudio();
  renderer.domElement.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  paused = !locked;
  if (locked) $('overlay').style.display = 'none';
  else { for (const k in keys) keys[k] = false; mouse.l = mouse.r = false; showPanel(); }
});
addEventListener('mousemove', e => {
  if (!locked || !player.alive) return;
  const k = sens * Math.tan(camera.fov * DEG / 2) / Math.tan(75 * DEG / 2);
  player.yaw -= e.movementX * k; player.pitch = clamp(player.pitch - e.movementY * k, -89 * DEG, 89 * DEG);
  mouse.dx += e.movementX; mouse.dy += e.movementY;
});
addEventListener('mousedown', e => { if (!locked) return; if (e.button === 0) { mouse.l = true; mouse.lPressed = true; } if (e.button === 2) mouse.r = true; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; if (e.button === 2) mouse.r = false; });
addEventListener('wheel', e => { if (locked) switchWeapon(player.weapon === 'ak' ? 'sniper' : 'ak'); });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!locked) return;
  if (e.code === 'KeyR' && player.alive && player.bandaging <= 0 && player.gun.boltT <= 0 && startReload(player.gun, player.armWound ? WOUND.armReload : 1)) playerNoise(NOISE.reload);
  if (e.code === 'KeyH') startBandage(player);
  if (e.code === 'Digit1') switchWeapon('ak');
  if (e.code === 'Digit2') switchWeapon('sniper');
  if (e.code === 'KeyB' && player.gun.w.auto) { player.mode = player.mode === 'auto' ? 'semi' : 'auto'; play(buf.click, { gain: 0.4, rate: 1.3 }); }
  if (e.code === 'BracketLeft' || e.code === 'BracketRight') {
    sens = clamp(sens * (e.code === 'BracketRight' ? 1.1 : 1 / 1.1), 0.0003, 0.01);
    try { localStorage.setItem('akd_sens', sens); } catch (err) {}
    showMsg(`Чутливість ${(sens * 1000).toFixed(2)}`, 1);
  }
  if (e.code === 'Space' || e.code === 'Tab') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = wCam.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); wCam.updateProjectionMatrix();
});

// ================= LOOP =================
let last = performance.now(), fpsN = 0, fpsT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  step(now, true);
}
// a hidden tab gets no animation frames; in PvP keep simulating and sending state (browsers throttle this to ~1/s)
setInterval(() => { if (document.hidden && game.mode === 'mp') step(performance.now(), false); }, 50);
function step(now, render) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const mp = game.mode === 'mp';
  // PvP never pauses: the others keep playing while your menu is open
  if ((game.state === 'playing' || (game.state === 'over' && !mp)) && (mp || !paused)) {
    game.time += dt;
    updatePlayer(dt);
    updatePlayerWeapon(dt);
    for (const b of bots) updateBot(b, dt);
    for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) pushApart(bots[i], bots[j]);
    updateBullets(dt);
  }
  if (mp) { updateAvatars(dt); netTick(dt); }
  updateParticles(dt);
  updateGore(dt);
  updateViewmodel(dt);
  updateCamera(dt);
  updatePools(dt);
  updateListener();
  if (!render) return;
  updateHUD(dt);
  renderer.info.reset();
  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(wScene, wCam);
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { $('fps').textContent = `${Math.round(fpsN / fpsT)} fps · ${renderer.info.render.calls} dc`; fpsN = 0; fpsT = 0; }
}
// menu backdrop
resetLevel();
setupBots(settings.bots);
for (const b of bots) respawnBot(b);
respawnPlayer();
showPanel();
requestAnimationFrame(frame);
// debug handle (console): G.debugRun(n) runs the sim without pointer lock
window.G = {
  game, player, bots, mouse, keys, bullets, settings, startMatch, damageCrate, switchWeapon, get boxes() { return boxes; },
  net, avatars,
  mpHost() { hostRoom(); startMpRound(settings.kills); paused = false; $('overlay').style.display = 'none'; },
  mpJoin(code) { joinRoom(code); startMpRound(net.kills); paused = false; $('overlay').style.display = 'none'; },
  debugRun(n = settings.bots) { settings.bots = n; startMatch(); paused = false; $('overlay').style.display = 'none'; },
};
</script>
</body>
